services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    mac_address: "02:42:ac:10:0f:15"
    dns:
      - 10.1.30.101
      - 10.1.30.102
      - 10.1.30.103
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - /opt/appdata/radarr:/config
      - /mnt/nas/movies:/movies
      - /mnt/nas/downloads:/downloads
      - /mnt:/mnt:rslave
    networks:
      macvlan_media:
        ipv4_address: 172.16.15.21
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    mac_address: "02:42:ac:10:0f:16"
    dns:
      - 10.1.30.101
      - 10.1.30.102
      - 10.1.30.103
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - /opt/appdata/sonarr:/config
      - /mnt/nas/tv:/tv
      - /mnt/nas/downloads:/downloads
      - /mnt:/mnt:rslave
    networks:
      macvlan_media:
        ipv4_address: 172.16.15.22
    restart: unless-stopped

  lidarr:
    image: lscr.io/linuxserver/lidarr:nightly
    container_name: lidarr
    mac_address: "02:42:ac:10:0f:17"
    dns:
      - 10.1.30.101
      - 10.1.30.102
      - 10.1.30.103
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - /opt/appdata/lidarr:/config
      - /mnt/nas/music:/music
      - /mnt/nas/music-staging:/music-staging
      - /mnt/nas/downloads:/downloads
      - /mnt:/mnt:rslave
    networks:
      macvlan_media:
        ipv4_address: 172.16.15.23
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    mac_address: "02:42:ac:10:0f:1a"
    dns:
      - 10.1.30.101
      - 10.1.30.102
      - 10.1.30.103
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - /opt/appdata/bazarr:/config
      - /mnt/nas/movies:/movies
      - /mnt/nas/tv:/tv
    networks:
      macvlan_media:
        ipv4_address: 172.16.15.26
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    mac_address: "02:42:ac:10:0f:19"
    dns:
      - 10.1.30.101
      - 10.1.30.102
      - 10.1.30.103
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - /opt/appdata/jellyseerr:/app/config
    networks:
      macvlan_media:
        ipv4_address: 172.16.15.25
    restart: unless-stopped

  readmeabook:
    image: ghcr.io/kikootwo/readmeabook:latest
    container_name: readmeabook
    mac_address: "02:42:ac:10:0f:25"
    dns:
      - 10.1.30.101
      - 10.1.30.102
      - 10.1.30.103
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=America/Los_Angeles
      - PUBLIC_URL=https://book-request.${DOMAIN}
      - LOG_LEVEL=info
      - DISABLE_LOCAL_LOGIN=true
    volumes:
      - /opt/appdata/readmeabook/config:/app/config
      - /opt/appdata/readmeabook/cache:/app/cache
      - /opt/appdata/readmeabook/pgdata:/var/lib/postgresql/data
      - /opt/appdata/readmeabook/redis:/var/lib/redis
      - /mnt/nas/downloads:/downloads
      - /mnt/nas/audiobooks:/media
      - /mnt/nas/ebooks:/bookdrop
      - /mnt:/mnt:rslave
      - /mnt:/downloads/hostmnt:rslave
    networks:
      macvlan_media:
        ipv4_address: 172.16.15.37
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

networks:
  macvlan_media:
    external: true