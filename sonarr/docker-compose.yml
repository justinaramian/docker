services:
  sonarr:
    image: ghcr.io/linuxserver/sonarr:4.0.19.2979-ls322
    container_name: sonarr
    mac_address: "02:42:ac:10:0f:16"
    dns:
      - 10.1.30.101
      - 10.1.30.102
      - 10.1.30.103
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - /opt/appdata/sonarr:/config
      - /mnt/nas/tv:/tv
      - /mnt/nas/downloads:/downloads
      - /mnt:/mnt:rslave
    networks:
      macvlan_media:
        ipv4_address: 172.16.15.22
    restart: unless-stopped

networks:
  macvlan_media:
    external: true