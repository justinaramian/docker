services:
  nebula-sync:
    image: ghcr.io/lovelaze/nebula-sync:v0.11.2
    container_name: nebula-sync
    restart: unless-stopped
    environment:
      PRIMARY: "http://${PIHOLE_PRIMARY}.${DOMAIN}|${PIHOLE_PASSWORD}"
      REPLICAS: "http://${PIHOLE_REPLICA}.${DOMAIN}|${PIHOLE_PASSWORD}"
      FULL_SYNC: "true"
      RUN_GRAVITY: "false"
      CRON: "0 * * * *"
      TZ: "America/Los_Angeles"
      # --- Webhooks: Success ---
      WEBHOOK_SYNC_SUCCESS_URL: "${DISCORD_WEBHOOK_URL}"
      WEBHOOK_SYNC_SUCCESS_HEADERS: "Content-Type: application/json"
      WEBHOOK_SYNC_SUCCESS_BODY: >-
        {"username":"Nebula-Sync","content":"✅ Nebula-Sync run completed","embeds":[{"title":"Sync Succeeded","description":"All targets processed without errors.","color":5793266,"fields":[{"name":"Primary","value":"${PIHOLE_PRIMARY}","inline":true},{"name":"Replicas","value":"${PIHOLE_REPLICA}","inline":true},{"name":"Mode","value":"FULL","inline":true}]}]}
      # --- Webhooks: Failure ---
      WEBHOOK_SYNC_FAILURE_URL: "${DISCORD_WEBHOOK_URL}"
      WEBHOOK_SYNC_FAILURE_HEADERS: "Content-Type: application/json"
      WEBHOOK_SYNC_FAILURE_METHOD: "POST"
      WEBHOOK_SYNC_FAILURE_BODY: >-
        {"username":"Nebula-Sync","content":"@here ❌ Nebula-Sync run failed","embeds":[{"title":"Sync Failed","description":"Check container logs on host for errors.","color":15548997,"fields":[{"name":"Primary","value":"${PIHOLE_PRIMARY}","inline":true},{"name":"Replicas","value":"${PIHOLE_REPLICA}","inline":true},{"name":"Mode","value":"FULL","inline":true}]}]}