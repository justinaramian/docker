services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:v2.16.1
    container_name: arcane
    restart: unless-stopped
    cgroup: host
    environment:
      - APP_URL=http://10.1.30.20:3552
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - PUID=1000
      - PGID=1000
      - PROJECTS_DIRECTORY=/opt/arcane/projects
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane_data:/app/data
      - /opt/arcane/projects:/opt/arcane/projects
    networks:
      macvlan_servers:
        ipv4_address: 10.1.30.20
        mac_address: 02:42:0a:01:1e:14

networks:
  macvlan_servers:
    external: true

volumes:
  arcane_data:
    name: arcane_data