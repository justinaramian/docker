services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:v3.1.1@sha256:f12cfe86238b892956d945681613e9056676ca0cda0d980abacad033ebb72bee
    container_name: arcane
    restart: unless-stopped
    cgroup: host
    environment:
      - ARCANE_APP_URL=${APP_URL}
      - ARCANE_TRUSTED_PROXIES=10.1.30.175
      - ARCANE_ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - PUID=1000
      - PGID=1000
      - ARCANE_PROJECTS_DIRECTORY=/opt/arcane/projects
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane_data:/app/data
      - /opt/arcane/projects:/opt/arcane/projects
    networks:
      macvlan_servers:
        ipv4_address: 10.1.30.20
        mac_address: 02:42:0a:01:1e:14

networks:
  macvlan_servers:
    external: true

volumes:
  arcane_data:
    name: arcane_data