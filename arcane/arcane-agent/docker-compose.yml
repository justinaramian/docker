services:
  arcane-agent:
    image: ghcr.io/getarcaneapp/agent:v3.2.0@sha256:c0a5ed4b2bfa643153f5b31a11ec4a5ca843da8a65231a9161802fd5e60ae1af
    container_name: arcane-agent
    restart: unless-stopped
    ports:
      - "3553:3553"
    environment:
      - ARCANE_AGENT=true
      - ARCANE_AGENT_TOKEN=${AGENT_TOKEN}
      - ARCANE_MANAGER_API_URL=${MANAGER_API_URL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane_agent_data:/app/data

volumes:
  arcane_agent_data:
    name: arcane_agent_data