services:
  arcane-agent:
    image: ghcr.io/getarcaneapp/agent:v3.1.1@sha256:63e9ed625daa26fb189fc1e52b0d96634c44b3668f831ecf5e07358f40ba8d73
    container_name: arcane-agent
    restart: unless-stopped
    ports:
      - "3553:3553"
    environment:
      - ARCANE_AGENT=true
      - ARCANE_AGENT_TOKEN=${AGENT_TOKEN}
      - ARCANE_MANAGER_API_URL=${MANAGER_API_URL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane_agent_data:/app/data

volumes:
  arcane_agent_data:
    name: arcane_agent_data