services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v3.4.1@sha256:7c489add298fc2f92cda4c777de6462aa206877e04087b815f62c7664af0b53b
    networks:
      macvlan_servers:
        ipv4_address: 10.1.30.46
        mac_address: 02:AA:30:00:00:46
    dns:
      - 10.1.30.101
      - 10.1.30.102
      - 10.1.30.103
    volumes:
      - /mnt/photos:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: immich_postgres
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich_redis
    depends_on:
      - redis
      - database
    restart: always

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.1@sha256:8adebf414256f6e4f837bfbb66fa94f14f4da7260e3a1d65cbba49e4e35d8764
    networks:
      macvlan_servers:
        ipv4_address: 10.1.30.47
        mac_address: 02:AA:30:00:00:47
    dns:
      - 10.1.30.101
      - 10.1.30.102
      - 10.1.30.103
    volumes:
      - model-cache:/cache
    restart: always

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    networks:
      macvlan_servers:
        ipv4_address: 10.1.30.48
        mac_address: 02:AA:30:00:00:48
    dns:
      - 10.1.30.101
      - 10.1.30.102
      - 10.1.30.103
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    networks:
      macvlan_servers:
        ipv4_address: 10.1.30.49
        mac_address: 02:AA:30:00:00:49
    dns:
      - 10.1.30.101
      - 10.1.30.102
      - 10.1.30.103
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - /opt/stacks/immich/postgres:/var/lib/postgresql/data
    restart: always

volumes:
  model-cache:

networks:
  macvlan_servers:
    external: true