services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v3.1.0
    networks:
      macvlan_servers:
        ipv4_address: 10.1.30.46
        mac_address: 02:AA:30:00:00:46
    dns:
      - 10.1.30.101
      - 10.1.30.102
      - 10.1.30.103
    volumes:
      - /mnt/photos:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: immich_postgres
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich_redis
    depends_on:
      - redis
      - database
    restart: always

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v3.1.0
    networks:
      macvlan_servers:
        ipv4_address: 10.1.30.47
        mac_address: 02:AA:30:00:00:47
    dns:
      - 10.1.30.101
      - 10.1.30.102
      - 10.1.30.103
    volumes:
      - model-cache:/cache
    restart: always

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9.1.2
    networks:
      macvlan_servers:
        ipv4_address: 10.1.30.48
        mac_address: 02:AA:30:00:00:48
    dns:
      - 10.1.30.101
      - 10.1.30.102
      - 10.1.30.103
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    networks:
      macvlan_servers:
        ipv4_address: 10.1.30.49
        mac_address: 02:AA:30:00:00:49
    dns:
      - 10.1.30.101
      - 10.1.30.102
      - 10.1.30.103
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - /opt/stacks/immich/postgres:/var/lib/postgresql/data
    restart: always

volumes:
  model-cache:

networks:
  macvlan_servers:
    external: true