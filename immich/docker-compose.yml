services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v3.4.2@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
    networks:
      macvlan_servers:
        ipv4_address: 10.1.30.46
        mac_address: 02:AA:30:00:00:46
    dns:
      - 10.1.30.101
      - 10.1.30.102
      - 10.1.30.103
    volumes:
      - /mnt/photos:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: immich_postgres
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich_redis
    depends_on:
      - redis
      - database
    restart: always

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.2@sha256:739405742a79bd7447227c553bb62ed5491aa36acf00bc667af7f9c93b6fae91
    networks:
      macvlan_servers:
        ipv4_address: 10.1.30.47
        mac_address: 02:AA:30:00:00:47
    dns:
      - 10.1.30.101
      - 10.1.30.102
      - 10.1.30.103
    volumes:
      - model-cache:/cache
    restart: always

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9.2.0@sha256:1c2b25b09f354c66fe994733acdf12fcfd4bdf6f3bd92b88a93a70378d884056
    networks:
      macvlan_servers:
        ipv4_address: 10.1.30.48
        mac_address: 02:AA:30:00:00:48
    dns:
      - 10.1.30.101
      - 10.1.30.102
      - 10.1.30.103
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    networks:
      macvlan_servers:
        ipv4_address: 10.1.30.49
        mac_address: 02:AA:30:00:00:49
    dns:
      - 10.1.30.101
      - 10.1.30.102
      - 10.1.30.103
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - /opt/stacks/immich/postgres:/var/lib/postgresql/data
    restart: always

volumes:
  model-cache:

networks:
  macvlan_servers:
    external: true