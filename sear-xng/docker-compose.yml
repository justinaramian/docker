services:
  searxng:
    image: searxng/searxng:2026.8.22-9fea41204@sha256:11a9b34cdc0b1ec2b991470a2762ecb5a1a531898289fb51dcd015260450729e
    container_name: searxng
    restart: unless-stopped
    networks:
      - searxng_bridge
    ports:
      - "8082:8080"
    volumes:
      - /opt/docker/searxng/config:/etc/searxng
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  searxng_bridge:
    driver: bridge