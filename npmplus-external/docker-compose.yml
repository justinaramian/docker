services:
  npmplus:
    image: docker.io/zoeyvid/npmplus:2026-11-18-r1
    container_name: npmplus-external
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: "America/Los_Angeles"
      TRUST_CLOUDFLARE: "true"
      LOGROTATE: "true"
      AUTH_REQUEST_AUTHENTIK_UPSTREAM: "http://172.16.98.62:9000"
    volumes:
      - /opt/docker/npmplus-external/data:/data
    dns:
      - 10.1.30.101
      - 10.1.30.103
      - 10.1.30.102
    networks:
      macvlan_dmz:
        ipv4_address: 172.16.97.200
        mac_address: "02:42:ac:10:61:c8"

networks:
  macvlan_dmz:
    external: true