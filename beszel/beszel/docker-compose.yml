services:
  beszel:
    image: henrygd/beszel:0.21.1@sha256:8514a69d9bbbcb74f371a3205561ee231fc0289739cea64e8131f341d695b770
    container_name: beszel
    restart: unless-stopped
    environment:
      APP_URL: https://${DOMAIN}
      USER_CREATION: "true"
      DISABLE_PASSWORD_AUTH: "true"
      OAUTH_DISABLE_POPUP: "true"
      SHARE_ALL_SYSTEMS: "true"
    volumes:
      - /opt/stacks/beszel/beszel_data:/beszel_data
      - /opt/stacks/beszel/beszel_socket:/beszel_socket
    networks:
      macvlan_servers:
        ipv4_address: 10.1.30.44
        mac_address: 02:42:0a:01:1e:2c

  beszel-agent:
    image: henrygd/beszel-agent:0.21.1@sha256:cb6868012964d7a68debaa2c84bb72285e5f08531e81f506bd4c493bf052e41c
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    depends_on:
      - beszel
    volumes:
      - /opt/stacks/beszel/beszel_agent_data:/var/lib/beszel-agent
      - /opt/stacks/beszel/beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /.beszel:/extra-filesystems/dm-0__OS:ro
      - /var/lib/docker/.beszel:/extra-filesystems/sdb__Docker:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      KEY: ${BESZEL_KEY}
      TOKEN: ${BESZEL_TOKEN}
      FILESYSTEM: ubuntu--vg-ubuntu--lv__OS

networks:
  macvlan_servers:
    external: true