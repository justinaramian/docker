services:
  beszel-agent:
    image: henrygd/beszel-agent-nvidia:0.21.1@sha256:b394ca0e451946de5595ae38ab3dbbb2c3390e4c04fb1f4b82ad8768bb8d19be
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - /opt/stacks/beszel-agent/data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /.beszel:/extra-filesystems/dm-0__OS:ro
      - /var/lib/docker/.beszel:/extra-filesystems/sdb__Docker:ro
    environment:
      LISTEN: 45876
      HUB_URL: http://10.1.30.44:8090
      KEY: ${BESZEL_KEY}
      TOKEN: ${BESZEL_TOKEN}
      GPU_COLLECTOR: nvml
      FILESYSTEM: ubuntu--vg-ubuntu--lv__OS
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - utility