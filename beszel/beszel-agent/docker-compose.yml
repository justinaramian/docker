services:
  beszel-agent:
    image: henrygd/beszel-agent:0.21.1@sha256:cb6868012964d7a68debaa2c84bb72285e5f08531e81f506bd4c493bf052e41c
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - /opt/stacks/beszel-agent/data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /.beszel:/extra-filesystems/dm-0__OS:ro
      - /var/lib/docker/.beszel:/extra-filesystems/sdb__Docker:ro
      - /var/cache/rclone/.beszel:/extra-filesystems/sdc__Rclone:ro
    environment:
      LISTEN: 45876
      HUB_URL: http://10.1.30.44:8090
      KEY: ${BESZEL_KEY}
      TOKEN: ${BESZEL_TOKEN}
      FILESYSTEM: ubuntu--vg-ubuntu--lv__OS