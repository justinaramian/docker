services:
  dozzle:
    image: amir20/dozzle:v10.7.5
    container_name: dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_LEVEL: info
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_ADDR: :8080
      DOZZLE_REMOTE_AGENT: 10.1.30.171:7007
    ports:
      - "8888:8080"
    networks:
      - dozzle_net
      
networks:
  dozzle_net:
    driver: bridge