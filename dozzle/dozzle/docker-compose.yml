services:
  dozzle:
    image: amir20/dozzle:v11.4.2@sha256:08cd5230e21e364241f3dcf26191f293166f7835654eb7e41168b9c685f0947b
    container_name: dozzle
    restart: unless-stopped
    mac_address: 02:42:0a:01:1e:2b
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle_data:/data
    environment:
      DOZZLE_LEVEL: info
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_ADDR: :8080
      DOZZLE_REMOTE_AGENT: 10.1.30.172:7007,10.1.30.173:7007,172.16.97.200:7007
      DOZZLE_AUTH_PROVIDER: forward-proxy
      DOZZLE_AUTH_LOGOUT_URL: ${DOZZLE_AUTH_LOGOUT_URL}
    networks:
      macvlan_servers:
        ipv4_address: 10.1.30.43

networks:
  macvlan_servers:
    external: true

volumes:
  dozzle_data: