services:
  dozzle:
    image: amir20/dozzle:v11.5.0@sha256:74600d62dd73a72a5d36fbd0c98af649203df921d74310b7ed383ef63392358e
    container_name: dozzle
    restart: unless-stopped
    mac_address: 02:42:0a:01:1e:2b
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle_data:/data
    environment:
      DOZZLE_LEVEL: info
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_ADDR: :8080
      DOZZLE_REMOTE_AGENT: 10.1.30.172:7007,10.1.30.173:7007
      DOZZLE_AUTH_PROVIDER: forward-proxy
      DOZZLE_AUTH_HEADER_USER: X-authentik-username
      DOZZLE_AUTH_HEADER_EMAIL: X-authentik-email
      DOZZLE_AUTH_HEADER_NAME: X-authentik-name
      DOZZLE_AUTH_LOGOUT_URL: ${DOZZLE_AUTH_LOGOUT_URL}
    networks:
      macvlan_servers:
        ipv4_address: 10.1.30.43

networks:
  macvlan_servers:
    external: true

volumes:
  dozzle_data: