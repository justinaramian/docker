services:
  dozzle-agent:
    image: amir20/dozzle:v10.7.5
    container_name: dozzle-agent
    restart: unless-stopped
    command: agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "7007:7007"
    networks:
      - dozzle_agent_net
    labels:
      - "wud.tag.include=^v\\d+\\.\\d+\\.\\d+$$"

networks:
  dozzle_agent_net:
    driver: bridge