services:
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8.7.1
    container_name: recyclarr
    mac_address: "02:42:ac:10:0f:1b"
    labels:
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$$"
      - 'wud.link.template=https://github.com/recyclarr/recyclarr/releases/tag/v$${raw}'
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - /opt/appdata/recyclarr:/config
    networks:
      macvlan_media:
        ipv4_address: 172.16.15.27
    restart: unless-stopped

  unpackerr:
    image: golift/unpackerr:0.15.2
    container_name: unpackerr
    mac_address: "02:42:ac:10:0f:1c"
    labels:
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$$"
      - 'wud.link.template=https://github.com/Unpackerr/unpackerr/releases/tag/v$${raw}'
    environment:
      - TZ=America/Los_Angeles
      - UN_RADARR_0_URL=http://172.16.15.21:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
      - UN_SONARR_0_URL=http://172.16.15.22:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_LIDARR_0_URL=http://172.16.15.23:8686
      - UN_LIDARR_0_API_KEY=${LIDARR_API_KEY}
    volumes:
      - /mnt/nas/downloads:/downloads
    networks:
      macvlan_media:
        ipv4_address: 172.16.15.28
    restart: unless-stopped

  tdarr:
    image: ghcr.io/haveagitgat/tdarr:2.86.01
    container_name: tdarr
    mac_address: "02:42:ac:10:0f:1f"
    labels:
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$$"
      - 'wud.link.template=https://tdarr.io/download/'
    dns:
      - 10.1.30.101
      - 10.1.30.102
      - 10.1.30.103
    environment:
      - TZ=America/Los_Angeles
      - PUID=1000
      - PGID=1000
      - UMASK_SET=002
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=false
      - inContainer=true
    volumes:
      - /opt/appdata/tdarr/server:/app/server
      - /opt/appdata/tdarr/configs:/app/configs
      - /opt/appdata/tdarr/logs:/app/logs
      - /mnt/nas/movies:/movies
      - /mnt/nas/tv:/tv
      - /mnt/nas/downloads/tdarr_staging:/temp
    networks:
      macvlan_media:
        ipv4_address: 172.16.15.31
    restart: unless-stopped

  tracearr:
    image: ghcr.io/connorgallopo/tracearr:supervised
    container_name: tracearr
    mac_address: "02:42:ac:10:0f:20"
    labels:
      - "wud.watch.digest=true"
      - 'wud.link.template=https://github.com/connorgallopo/tracearr/releases'
    dns:
      - 10.1.30.101
      - 10.1.30.102
      - 10.1.30.103
    shm_size: 512mb
    mem_limit: 3g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      - TZ=America/Los_Angeles
      - LOG_LEVEL=info
    volumes:
      - tracearr_postgres:/data/postgres
    networks:
      macvlan_media:
        ipv4_address: 172.16.15.32
    restart: unless-stopped

  beets:
    image: ghcr.io/linuxserver/beets:2.13.1-ls349
    container_name: beets
    mac_address: "02:42:ac:10:0f:22"
    labels:
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+-ls\\d+$$"
      - 'wud.link.template=https://github.com/linuxserver/docker-beets/releases/tag/$${raw}'
    dns:
      - 10.1.30.101
      - 10.1.30.102
      - 10.1.30.103
    environment:
      - TZ=America/Los_Angeles
      - PUID=1000
      - PGID=1000
    volumes:
      - /opt/appdata/beets:/config
      - /mnt/nas/music:/music
      - /mnt/nas/music-staging:/music-staging
    networks:
      macvlan_media:
        ipv4_address: 172.16.15.34
    restart: unless-stopped

networks:
  macvlan_media:
    external: true

volumes:
  tracearr_postgres: