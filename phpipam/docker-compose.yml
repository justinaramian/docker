services:
  phpipam-db:
    image: mariadb:11.8@sha256:d36f18d65a0459510b8b0f643b226a6d299e3206486e2b64ff20754a6d291707
    container_name: phpipam-db
    restart: unless-stopped
    command: --innodb-buffer-pool-size=256M
    environment:
      TZ: America/Los_Angeles
      MARIADB_AUTO_UPGRADE: 1
      MARIADB_ROOT_PASSWORD: ${IPAM_DB_ROOT_PASS}
      MARIADB_DATABASE: phpipam
      MARIADB_USER: phpipam
      MARIADB_PASSWORD: ${IPAM_DB_PASS}
    volumes:
      - phpipam-db-data:/var/lib/mysql
    networks:
      - phpipam-backend

  phpipam-www:
    image: phpipam/phpipam-www:v1.9.0@sha256:af04a5bf7b63a39e9950ee509798b30d1444770b9f3ce165d41ad846b5189e2d
    container_name: phpipam-www
    restart: unless-stopped
    depends_on:
      - phpipam-db
    environment:
      TZ: America/Los_Angeles
      IPAM_DATABASE_HOST: phpipam-db
      IPAM_DATABASE_NAME: phpipam
      IPAM_DATABASE_USER: phpipam
      IPAM_DATABASE_PASS: ${IPAM_DB_PASS}
      IPAM_DATABASE_WEBHOST: '%'
      IPAM_TRUST_X_FORWARDED: 'true'
      IPAM_DISABLE_INSTALLER: ${IPAM_DISABLE_INSTALLER}
    volumes:
      - phpipam-logo:/phpipam/css/images/logo
      - phpipam-ca:/usr/local/share/ca-certificates:ro
    networks:
      phpipam-backend:
      macvlan_servers:
        ipv4_address: 10.1.30.40
        mac_address: 02:42:0a:01:1e:28

  phpipam-cron:
    image: phpipam/phpipam-cron:v1.9.0@sha256:3bc24921019bc76e817942cf93ffc64bbe2e520ab3d67eff6d38dbd5569a35b2
    container_name: phpipam-cron
    restart: unless-stopped
    depends_on:
      - phpipam-db
    environment:
      TZ: America/Los_Angeles
      IPAM_DATABASE_HOST: phpipam-db
      IPAM_DATABASE_NAME: phpipam
      IPAM_DATABASE_USER: phpipam
      IPAM_DATABASE_PASS: ${IPAM_DB_PASS}
      IPAM_DATABASE_WEBHOST: '%'
      SCAN_INTERVAL: 15m
    volumes:
      - phpipam-ca:/usr/local/share/ca-certificates:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      phpipam-backend:
      macvlan_servers:
        ipv4_address: 10.1.30.41
        mac_address: 02:42:0a:01:1e:29

networks:
  phpipam-backend:
    driver: bridge
  macvlan_servers:
    external: true

volumes:
  phpipam-db-data:
  phpipam-logo:
  phpipam-ca: