services:
  phpipam-db:
    image: mariadb:11.8@sha256:c4124d1afa875e47f2892edf26b482fa54f796e2f342d3717a04ca091a22a9bd
    container_name: phpipam-db
    restart: unless-stopped
    command: --innodb-buffer-pool-size=256M
    environment:
      TZ: America/Los_Angeles
      MARIADB_AUTO_UPGRADE: 1
      MARIADB_ROOT_PASSWORD: ${IPAM_DB_ROOT_PASS}
      MARIADB_DATABASE: phpipam
      MARIADB_USER: phpipam
      MARIADB_PASSWORD: ${IPAM_DB_PASS}
    volumes:
      - phpipam-db-data:/var/lib/mysql
    networks:
      - phpipam-backend

  phpipam-www:
    image: phpipam/phpipam-www:v1.9.0@sha256:f991a93db7bc8ac48768de92c51b22aa5e62611c49e11147338a0f33e8e0ce8b
    container_name: phpipam-www
    restart: unless-stopped
    depends_on:
      - phpipam-db
    environment:
      TZ: America/Los_Angeles
      IPAM_DATABASE_HOST: phpipam-db
      IPAM_DATABASE_NAME: phpipam
      IPAM_DATABASE_USER: phpipam
      IPAM_DATABASE_PASS: ${IPAM_DB_PASS}
      IPAM_DATABASE_WEBHOST: '%'
      IPAM_TRUST_X_FORWARDED: 'true'
      IPAM_DISABLE_INSTALLER: ${IPAM_DISABLE_INSTALLER}
    volumes:
      - phpipam-logo:/phpipam/css/images/logo
      - phpipam-ca:/usr/local/share/ca-certificates:ro
    networks:
      phpipam-backend:
      macvlan_servers:
        ipv4_address: 10.1.30.40
        mac_address: 02:42:0a:01:1e:28

  phpipam-cron:
    image: phpipam/phpipam-cron:v1.9.0@sha256:ba9ff9555d953e28218ad2b104c6c61e32f3f0a8b24647e903c9ae0bb03c15b6
    container_name: phpipam-cron
    restart: unless-stopped
    depends_on:
      - phpipam-db
    environment:
      TZ: America/Los_Angeles
      IPAM_DATABASE_HOST: phpipam-db
      IPAM_DATABASE_NAME: phpipam
      IPAM_DATABASE_USER: phpipam
      IPAM_DATABASE_PASS: ${IPAM_DB_PASS}
      IPAM_DATABASE_WEBHOST: '%'
      SCAN_INTERVAL: 15m
    volumes:
      - phpipam-ca:/usr/local/share/ca-certificates:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      phpipam-backend:
      macvlan_servers:
        ipv4_address: 10.1.30.41
        mac_address: 02:42:0a:01:1e:29

networks:
  phpipam-backend:
    driver: bridge
  macvlan_servers:
    external: true

volumes:
  phpipam-db-data:
  phpipam-logo:
  phpipam-ca: