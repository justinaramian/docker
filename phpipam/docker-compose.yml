services:
  phpipam-db:
    image: mariadb:11.8@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
    container_name: phpipam-db
    restart: unless-stopped
    command: --innodb-buffer-pool-size=256M
    environment:
      TZ: America/Los_Angeles
      MARIADB_AUTO_UPGRADE: 1
      MARIADB_ROOT_PASSWORD: ${IPAM_DB_ROOT_PASS}
      MARIADB_DATABASE: phpipam
      MARIADB_USER: phpipam
      MARIADB_PASSWORD: ${IPAM_DB_PASS}
    volumes:
      - phpipam-db-data:/var/lib/mysql
    networks:
      - phpipam-backend

  phpipam-www:
    image: phpipam/phpipam-www:v1.8.3@sha256:f76005675587d783eea588457b0c1fca86775b44c6cdac5f7526de49dbebcc25
    container_name: phpipam-www
    restart: unless-stopped
    depends_on:
      - phpipam-db
    environment:
      TZ: America/Los_Angeles
      IPAM_DATABASE_HOST: phpipam-db
      IPAM_DATABASE_NAME: phpipam
      IPAM_DATABASE_USER: phpipam
      IPAM_DATABASE_PASS: ${IPAM_DB_PASS}
      IPAM_DATABASE_WEBHOST: '%'
      IPAM_TRUST_X_FORWARDED: 'true'
      IPAM_DISABLE_INSTALLER: ${IPAM_DISABLE_INSTALLER}
    volumes:
      - phpipam-logo:/phpipam/css/images/logo
      - phpipam-ca:/usr/local/share/ca-certificates:ro
    networks:
      phpipam-backend:
      macvlan_servers:
        ipv4_address: 10.1.30.40
        mac_address: 02:42:0a:01:1e:28

  phpipam-cron:
    image: phpipam/phpipam-cron:v1.8.3@sha256:5a31cce1b9ef7d1c7933bbf6ca694de6721ca2385b0bbce09e27507624be489c
    container_name: phpipam-cron
    restart: unless-stopped
    depends_on:
      - phpipam-db
    environment:
      TZ: America/Los_Angeles
      IPAM_DATABASE_HOST: phpipam-db
      IPAM_DATABASE_NAME: phpipam
      IPAM_DATABASE_USER: phpipam
      IPAM_DATABASE_PASS: ${IPAM_DB_PASS}
      IPAM_DATABASE_WEBHOST: '%'
      SCAN_INTERVAL: 15m
    volumes:
      - phpipam-ca:/usr/local/share/ca-certificates:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      phpipam-backend:
      macvlan_servers:
        ipv4_address: 10.1.30.41
        mac_address: 02:42:0a:01:1e:29

networks:
  phpipam-backend:
    driver: bridge
  macvlan_servers:
    external: true

volumes:
  phpipam-db-data:
  phpipam-logo:
  phpipam-ca: