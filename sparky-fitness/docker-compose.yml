services:
  sparkyfitness-db:
    image: postgres:18.6-alpine
    container_name: sparkyfitness-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sparkyfitness
      POSTGRES_USER: sparky
      POSTGRES_PASSWORD: ${SPARKY_DB_PASSWORD}
    volumes:
      - /data/sparkyfitness/postgresql:/var/lib/postgresql
    networks:
      - sparkyfitness-network

  sparkyfitness-server:
    image: codewithcj/sparkyfitness_server:v1.9.0@sha256:f8be8d6963d17e4e5e406a4a8462c0ca4ce5c7e54fd9cb52890f5bfb7012b365
    container_name: sparkyfitness-server
    restart: unless-stopped
    depends_on:
      - sparkyfitness-db
    environment:
      SPARKY_FITNESS_LOG_LEVEL: info
      ALLOW_PRIVATE_NETWORK_CORS: "false"
      SPARKY_FITNESS_EXTRA_TRUSTED_ORIGINS: ""
      SPARKY_FITNESS_DB_HOST: sparkyfitness-db
      SPARKY_FITNESS_DB_NAME: sparkyfitness
      SPARKY_FITNESS_DB_USER: sparky
      SPARKY_FITNESS_DB_PASSWORD: ${SPARKY_DB_PASSWORD}
      SPARKY_FITNESS_DB_PORT: 5432
      SPARKY_FITNESS_APP_DB_USER: sparkyapp
      SPARKY_FITNESS_APP_DB_PASSWORD: ${SPARKY_APP_DB_PASSWORD}
      SPARKY_FITNESS_API_ENCRYPTION_KEY: ${SPARKY_API_ENCRYPTION_KEY}
      BETTER_AUTH_SECRET: ${SPARKY_BETTER_AUTH_SECRET}
      SPARKY_FITNESS_FRONTEND_URL: https://health.${DOMAIN}
      SPARKY_FITNESS_DISABLE_SIGNUP: "false"
      SPARKY_FITNESS_ADMIN_EMAIL: ${SPARKY_ADMIN_EMAIL}
      SPARKY_FITNESS_EMAIL_HOST: ""
      SPARKY_FITNESS_EMAIL_PORT: ""
      SPARKY_FITNESS_EMAIL_SECURE: ""
      SPARKY_FITNESS_EMAIL_USER: ""
      SPARKY_FITNESS_EMAIL_PASS: ""
      SPARKY_FITNESS_EMAIL_FROM: ""
    volumes:
      - /data/sparkyfitness/backup:/app/SparkyFitnessServer/backup
      - /data/sparkyfitness/uploads:/app/SparkyFitnessServer/uploads
    networks:
      - sparkyfitness-network

  sparkyfitness-frontend:
    image: codewithcj/sparkyfitness:v1.9.0@sha256:35d599d80e8a06c0a4b218d6fa7c23d6d3e5818ee7db17edb6820c6deb9611b2
    container_name: sparkyfitness-frontend
    restart: unless-stopped
    depends_on:
      - sparkyfitness-server
    ports:
      - "3004:80"
    environment:
      SPARKY_FITNESS_FRONTEND_URL: https://health.${DOMAIN}
      SPARKY_FITNESS_SERVER_HOST: sparkyfitness-server
      SPARKY_FITNESS_SERVER_PORT: 3010
    networks:
      - sparkyfitness-network

networks:
  sparkyfitness-network:
    driver: bridge