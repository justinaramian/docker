services:
  stirling-pdf:
    image: stirlingtools/stirling-pdf:2.14.3
    container_name: stirling-pdf
    hostname: stirling-pdf
    restart: unless-stopped
    mac_address: 02:42:0a:01:1e:35
    networks:
      macvlan_servers:
        ipv4_address: 10.1.30.53
    environment:
      SECURITY_ENABLELOGIN: "false"
      DISABLE_ADDITIONAL_FEATURES: "false"
      SYSTEM_DEFAULTLOCALE: en-US
      SYSTEM_GOOGLEVISIBILITY: "false"
      SYSTEM_MAXFILESIZE: "200"
      LANGS: en_US
      METRICS_ENABLED: "true"
      TZ: America/Los_Angeles
      UI_APPNAME: Stirling PDF
      UI_APPNAMENAVBAR: Stirling PDF
    volumes:
      - /opt/stacks/stirling-pdf/tessdata:/usr/share/tessdata
      - /opt/stacks/stirling-pdf/configs:/configs
      - /opt/stacks/stirling-pdf/customFiles:/customFiles
      - /opt/stacks/stirling-pdf/logs:/logs
      - /opt/stacks/stirling-pdf/pipeline:/pipeline
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/info/status | grep -q 'UP'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

networks:
  macvlan_servers:
    external: true