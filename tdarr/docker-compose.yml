services:
  tdarr:
    image: ghcr.io/haveagitgat/tdarr:2.86.01
    container_name: tdarr
    mac_address: "02:42:ac:10:0f:1f"
    dns:
      - 10.1.30.101
      - 10.1.30.102
      - 10.1.30.103
    environment:
      - TZ=America/Los_Angeles
      - PUID=1000
      - PGID=1000
      - UMASK_SET=002
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=false
      - inContainer=true
    volumes:
      - /opt/appdata/tdarr/server:/app/server
      - /opt/appdata/tdarr/configs:/app/configs
      - /opt/appdata/tdarr/logs:/app/logs
      - /mnt/nas/movies:/movies
      - /mnt/nas/tv:/tv
      - /mnt/nas/downloads/tdarr_staging:/temp
    networks:
      macvlan_media:
        ipv4_address: 172.16.15.31
    restart: unless-stopped

networks:
  macvlan_media:
    external: true