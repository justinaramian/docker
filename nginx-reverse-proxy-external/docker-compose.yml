services:
  app:
    image: 'jc21/nginx-proxy-manager:2.17.0@sha256:9cdfebbcbb6a70b84c538e6e39862c5d627171e5f4ea4bfda933f7643e3640a4'
    restart: unless-stopped
    container_name: nginx-reverse-proxy-external
    environment:
      TZ: "America/Los_Angeles"
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - /opt/docker/nginx-reverse-proxy-external/data:/data
      - /opt/docker/nginx-reverse-proxy-external/letsencrypt:/etc/letsencrypt
    dns:
      - 10.1.30.101
      - 10.1.30.103
      - 10.1.30.102