services:
  app:
    image: 'jc21/nginx-proxy-manager:2.15.1'
    restart: unless-stopped
    container_name: nginx-reverse-proxy-external
    environment:
      TZ: "America/Los_Angeles"
    labels:
      wud.watch: "true"
      wud.tag.include: '^\d+\.\d+\.\d+$$'
      wud.display.name: "Nginx-Proxy-Manager-External"
      wud.link.template: 'https://github.com/NginxProxyManager/nginx-proxy-manager/releases/tag/v$${major}.$${minor}.$${patch}'
    volumes:
      - /opt/docker/nginx-reverse-proxy-external/data:/data
      - /opt/docker/nginx-reverse-proxy-external/letsencrypt:/etc/letsencrypt
    networks:
      macvlan_dmz:
        ipv4_address: 172.16.97.200
        mac_address: "42:7e:ec:b0:82:6c"
    dns:
      - 10.1.30.101
      - 10.1.30.103
      - 10.1.30.102
networks:
  macvlan_dmz:
    external: true