services:
  app:
    image: 'jc21/nginx-proxy-manager:2.16.0@sha256:4393e642e233e5efd5adeb7f10918d4aaea71c9ed875b94190273fc8e87f9594'
    restart: unless-stopped
    container_name: nginx-reverse-proxy-external
    environment:
      TZ: "America/Los_Angeles"
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - /opt/docker/nginx-reverse-proxy-external/data:/data
      - /opt/docker/nginx-reverse-proxy-external/letsencrypt:/etc/letsencrypt
    dns:
      - 10.1.30.101
      - 10.1.30.103
      - 10.1.30.102