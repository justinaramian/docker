services:
  app:
    image: 'jc21/nginx-proxy-manager:2.17.1@sha256:04a9d0835560b9719ab577275f84fe1f713298a1c1e2bdefa034b87f10e062e1'
    restart: unless-stopped
    container_name: nginx-reverse-proxy-external
    environment:
      TZ: "America/Los_Angeles"
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - /opt/docker/nginx-reverse-proxy-external/data:/data
      - /opt/docker/nginx-reverse-proxy-external/letsencrypt:/etc/letsencrypt
    dns:
      - 10.1.30.101
      - 10.1.30.103
      - 10.1.30.102