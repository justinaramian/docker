services:
  freshrss:
    image: ghcr.io/linuxserver/freshrss:1.31.0-ls333@sha256:ad35910b3396901b35ed08359d1b8a7c8e1d017fce98ef3564cc8e76478bd6aa
    container_name: fresh-rss
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "America/Los_Angeles"
    volumes:
      - freshrss_config:/config
    ports:
      - "0.0.0.0:32769:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  freshrss_config: {}