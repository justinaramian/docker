services:
  freshrss:
    image: ghcr.io/linuxserver/freshrss:1.30.4-ls327@sha256:3bdf970c2baebb4e8c8753c84e44c87991888311a437466d669b0016bb7e89c5
    container_name: fresh-rss
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "America/Los_Angeles"
    volumes:
      - freshrss_config:/config
    ports:
      - "0.0.0.0:32769:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  freshrss_config: {}