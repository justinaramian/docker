services:
  unpackerr:
    image: golift/unpackerr:0.15.2
    container_name: unpackerr
    mac_address: "02:42:ac:10:0f:1c"
    environment:
      - TZ=America/Los_Angeles
      - UN_RADARR_0_URL=http://172.16.15.21:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
      - UN_SONARR_0_URL=http://172.16.15.22:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_LIDARR_0_URL=http://172.16.15.23:8686
      - UN_LIDARR_0_API_KEY=${LIDARR_API_KEY}
    volumes:
      - /mnt/nas/downloads:/downloads
    networks:
      macvlan_media:
        ipv4_address: 172.16.15.28
    restart: unless-stopped

networks:
  macvlan_media:
    external: true