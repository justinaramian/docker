services:
  ollama:
    image: ollama/ollama:0.34.2
    container_name: ollama
    restart: unless-stopped
    environment:
      - TZ=America/Los_Angeles
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_FLASH_ATTENTION=1
    volumes:
      - ollama_data:/root/.ollama
    networks:
      macvlan_servers:
        ipv4_address: 10.1.30.57
        mac_address: 02:42:0a:01:1e:39
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.4
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      - "TZ=America/Los_Angeles"
      - "OLLAMA_BASE_URL=http://ollama:11434"
      - "WEBUI_URL=${WEBUI_URL}"
      - "WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}"
      - "ENABLE_PERSISTENT_CONFIG=false"
      - "ENABLE_OAUTH_SIGNUP=true"
      - "OAUTH_MERGE_ACCOUNTS_BY_EMAIL=true"
      - "OAUTH_PROVIDER_NAME=Authentik"
      - "OPENID_PROVIDER_URL=${OPENID_PROVIDER_URL}"
      - "OPENID_REDIRECT_URI=${OPENID_REDIRECT_URI}"
      - "OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}"
      - "OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}"
      - "OAUTH_SCOPES=openid email profile groups"
      - "ENABLE_LOGIN_FORM=false"
      - "OAUTH_AUTO_REDIRECT=true"
      - "ENABLE_OAUTH_ROLE_MANAGEMENT=true"
      - "OAUTH_ROLES_CLAIM=groups"
      - "OAUTH_ALLOWED_ROLES=${OAUTH_ALLOWED_ROLES}"
      - "OAUTH_ADMIN_ROLES=${OAUTH_ADMIN_ROLES}"
      - "ENABLE_WEB_SEARCH=true"
      - "WEB_SEARCH_ENGINE=searxng"
      - "SEARXNG_QUERY_URL=${SEARXNG_QUERY_URL}"
      - "WEB_SEARCH_RESULT_COUNT=3"
      - "WEB_SEARCH_CONCURRENT_REQUESTS=3"
      - "BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL=true"
      - "BYPASS_WEB_SEARCH_WEB_LOADER=true"
      - "DEFAULT_USER_ROLE=user"
      - "DEFAULT_MODELS=gemma4:12b"
    volumes:
      - openwebui_data:/app/backend/data
    networks:
      macvlan_servers:
        ipv4_address: 10.1.30.58
        mac_address: 02:42:0a:01:1e:3a

volumes:
  ollama_data:
  openwebui_data:

networks:
  macvlan_servers:
    external: true