services:
  postgres:
    image: postgres:17.11@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
    container_name: rxresume-postgres
    restart: unless-stopped
    networks:
      - rxresume_net
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${RXRESUME_DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  reactive-resume:
    image: amruthpillai/reactive-resume:v6.1.0@sha256:b158308cd898db021ecd0b41024dbf4caef0ac97917b6ec6006156598b2eba72
    container_name: rxresume
    restart: unless-stopped
    networks:
      - rxresume_net
    ports:
      - "3005:3000"
    volumes:
      - rxresume_data:/app/data
    environment:
      TZ: "America/Los_Angeles"
      APP_URL: "https://resume.${DOMAIN}"
      DATABASE_URL: "postgresql://postgres:${RXRESUME_DB_PASSWORD}@postgres:5432/postgres"
      AUTH_SECRET: "${RXRESUME_AUTH_SECRET}"
      # --- Authentik OIDC ---
      OAUTH_PROVIDER_NAME: "${RXRESUME_OAUTH_PROVIDER_NAME}"
      OAUTH_CLIENT_ID: "${RXRESUME_OAUTH_CLIENT_ID}"
      OAUTH_CLIENT_SECRET: "${RXRESUME_OAUTH_CLIENT_SECRET}"
      OAUTH_DISCOVERY_URL: "https://auth.${DOMAIN}/application/o/reactive-resume/.well-known/openid-configuration"
      OAUTH_SCOPES: "openid profile email"
      # --- Lock down to SSO only ---
      # Flip FLAG_DISABLE_SIGNUPS to "true" once every user has logged in once
      FLAG_DISABLE_SIGNUPS: "false"
      FLAG_DISABLE_EMAIL_AUTH: "true"
      FLAG_SHOW_SPONSORS: "false"
    depends_on:
      postgres:
        condition: service_healthy

networks:
  rxresume_net:
    driver: bridge

volumes:
  postgres_data:
  rxresume_data: