services:
  portainer:
    image: portainer/portainer-ee:2.45.1
    container_name: portainer
    restart: always
    network_mode: bridge
    ports:
      - "8000:8000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
      - /etc/homelab/root-ca.crt:/certs/root-ca.crt:ro

volumes:
  portainer_data:
    external: true