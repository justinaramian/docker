services:
  renovate:
    image: renovate/renovate:44.222.4@sha256:306316fc9e8c424dde672590699d681f9c8764cc9152141d2c5059956ce1e3b8
    container_name: renovate
    hostname: renovate
    restart: unless-stopped
    command: ["bash", "-c", "while true; do renovate; sleep 21600; done"]
    environment:
      TZ: America/Los_Angeles
      LOG_LEVEL: info
      RENOVATE_PLATFORM: gitea
      RENOVATE_ENDPOINT: https://${GITEA_HOST}/api/v1/
      RENOVATE_TOKEN: ${RENOVATE_GITEA_TOKEN}
      RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate@${DOMAIN}>"
      RENOVATE_REPOSITORIES: homelab/docker
      RENOVATE_ONBOARDING: "true"
      RENOVATE_ONBOARDING_CONFIG: '{"extends":["config:recommended"]}'
      RENOVATE_BASE_DIR: /tmp/renovate
      RENOVATE_REPOSITORY_CACHE: enabled
      GITHUB_COM_TOKEN: ${RENOVATE_GITHUB_TOKEN}
      RENOVATE_CONFIG: ${RENOVATE_CONFIG}
    volumes:
      - renovate-cache:/tmp/renovate
    networks:
      macvlan_servers:
        ipv4_address: 10.1.30.54
        mac_address: 02:42:0a:01:1e:36

volumes:
  renovate-cache:

networks:
  macvlan_servers:
    external: true