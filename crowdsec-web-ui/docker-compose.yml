   services:
     crowdsec-web-ui:
       image: ghcr.io/theduffman85/crowdsec-web-ui:2026.10.3
       container_name: crowdsec-web-ui
       hostname: crowdsec-web-ui
       restart: unless-stopped
       environment:
         TZ: America/Los_Angeles
         CONFIG_UI_TIME_ZONE: America/Los_Angeles
         CONFIG_INSTANCE_ID: frecs01
         CONFIG_INSTANCE_NAME: frecs01
         CONFIG_INSTANCE_LAPI_URL: http://10.1.30.140:8080
         CONFIG_INSTANCE_LAPI_AUTH_USERNAME: crowdsec-web-ui
         CONFIG_INSTANCE_LAPI_AUTH_PASSWORD: ${LAPI_PASSWORD}
         CONFIG_INSTANCE_METRICS_URL: http://10.1.30.140:6060/metrics
         CONFIG_AUTH_OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
         CONFIG_AUTH_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
         CONFIG_AUTH_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
         CONFIG_AUTH_OIDC_GROUPS_CLAIM: "groups"
         CONFIG_AUTH_OIDC_ADMIN_GROUPS_0: "Crowdsec Administrators"
         CONFIG_AUTH_OIDC_READ_ONLY_GROUPS_0: "Crowdsec Users"
         CONFIG_AUTH_OIDC_SCOPE: "openid profile email groups"
       volumes:
         - crowdsec-web-ui-data:/app/data
       networks:
         macvlan_servers:
           ipv4_address: 10.1.30.42
           mac_address: 02:42:0a:01:1e:2a

   volumes:
     crowdsec-web-ui-data:

   networks:
     macvlan_servers:
       external: true