services:
  sabnzbd:
    image: ghcr.io/linuxserver/sabnzbd:5.1.2-ls270
    container_name: sabnzbd
    mac_address: "02:42:ac:10:0f:1e"  # 172.16.15.30
    labels:
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+-ls\\d+$$"
      - 'wud.link.template=https://github.com/linuxserver/docker-sabnzbd/releases/tag/$${raw}'
    dns:
      - 10.1.30.101
      - 10.1.30.102
      - 10.1.30.103
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - /opt/appdata/sabnzbd:/config
      - /mnt/nas/downloads:/downloads
    networks:
      macvlan_media:
        ipv4_address: 172.16.15.30
    restart: unless-stopped

  prowlarr:
    image: ghcr.io/linuxserver/prowlarr:2.5.2.5491-ls156
    container_name: prowlarr
    mac_address: "02:42:ac:10:0f:18"  # 172.16.15.24
    labels:
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+\\.\\d+-ls\\d+$$"
      - 'wud.link.template=https://github.com/linuxserver/docker-prowlarr/releases/tag/$${raw}'
    dns:
      - 10.1.30.101
      - 10.1.30.102
      - 10.1.30.103
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - /opt/appdata/prowlarr:/config
    networks:
      macvlan_media:
        ipv4_address: 172.16.15.24
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    container_name: flaresolverr
    mac_address: "02:42:ac:10:0f:1d"  # 172.16.15.29
    labels:
      - "wud.tag.include=^v\\d+\\.\\d+\\.\\d+$$"
      - 'wud.link.template=https://github.com/FlareSolverr/FlareSolverr/releases/tag/$${raw}'
    dns:
      - 10.1.30.101
      - 10.1.30.102
      - 10.1.30.103
    environment:
      - TZ=America/Los_Angeles
      - LOG_LEVEL=info
    networks:
      macvlan_media:
        ipv4_address: 172.16.15.29
    restart: unless-stopped

networks:
  macvlan_media:
    external: true